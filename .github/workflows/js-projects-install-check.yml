name: JS Projects Install & Build Check

# Projects covered by a dedicated Docker Image CI workflow (learning-react,
# learning-qwik, html.nodejs.dj.upayan.dev) already install and build on
# every push/PR, so they are intentionally excluded from this matrix.

on:
  push:
    branches: ['main']
    paths:
      - 'NodeJS/**'
      - 'Typescript/**'
      - 'astro/**'
      - 'electronjs/**'
      - 'nextjs/**'
      - 'react/VIT/react-crud/**'
      - 'react/crud-operations/**'
      - 'react/last-practice/**'
      - '.github/workflows/js-projects-install-check.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'NodeJS/**'
      - 'Typescript/**'
      - 'astro/**'
      - 'electronjs/**'
      - 'nextjs/**'
      - 'react/VIT/react-crud/**'
      - 'react/crud-operations/**'
      - 'react/last-practice/**'
      - '.github/workflows/js-projects-install-check.yml'

permissions:
  contents: read

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { path: 'NodeJS', build: false }
          - { path: 'NodeJS/crud-operations-mongodb', build: false }
          - { path: 'NodeJS/my-rest-api', build: false }
          - { path: 'NodeJS/rest-api', build: false }
          - { path: 'Typescript/website', build: false }
          - { path: 'Typescript/fleet-tracker/api', build: true }
          - { path: 'Typescript/fleet-tracker/app', build: true }
          - { path: 'astro/learning-astro', build: true }
          - { path: 'electronjs', build: false }
          - { path: 'nextjs/learning-nextjs', build: true }
          - { path: 'react/VIT/react-crud/api', build: false }
          - { path: 'react/VIT/react-crud/app', build: true }
          - { path: 'react/crud-operations/api', build: false }
          - { path: 'react/crud-operations/app', build: true }
          - { path: 'react/last-practice/api', build: false }
          - { path: 'react/last-practice/app', build: true }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.project.path }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: matrix.project.build
        working-directory: ${{ matrix.project.path }}
        run: pnpm run build
