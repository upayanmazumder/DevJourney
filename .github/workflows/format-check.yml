name: Format Check

# Verifies that files changed by the push/PR are formatted with the
# repository's declared styles (.prettierrc.json, .clang-format,
# pyproject.toml for black, gofmt, google-java-format).
# Only changed files are checked, so the existing unformatted history does
# not block contributions.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install formatters
        run: |
          npm install -g prettier@3
          python -m pip install --quiet black clang-format==23.1.5
          # google-java-format is not packaged for apt; use the all-deps jar
          # pinned to the same version developers run locally.
          sudo curl -sSL -o /opt/google-java-format.jar \
            https://repo1.maven.org/maven2/com/google/googlejavaformat/google-java-format/1.37.0/google-java-format-1.37.0-all-deps.jar
          sudo tee /usr/local/bin/google-java-format >/dev/null <<'WRAPPER'
          #!/bin/sh
          exec java -jar /opt/google-java-format.jar "$@"
          WRAPPER
          sudo chmod +x /usr/local/bin/google-java-format
          google-java-format --version

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD > /tmp/changed.z || true
          count=$(tr -cd '\0' < /tmp/changed.z | wc -c)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          tr '\0' '\n' < /tmp/changed.z

      - name: Check formatting of changed files
        if: steps.changed.outputs.count != '0'
        env:
          SKIP_FORMAT: "0"
        run: |
          mapfile -d '' files < /tmp/changed.z
          existing=()
          for f in "${files[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          if ((${#existing[@]} == 0)); then
            echo 'No formattable files changed.'
            exit 0
          fi
          git add -- "${existing[@]}"
          ./format --check
